<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #5e5959;
        padding: 10px 20px;
      }

      .logo {
        color: white;
        font-size: 24px;
        font-weight: bold;
      }

      .menu {
        display: flex;
        gap: 20px;
      }

      .menu a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        transition: color 0.3s;
      }

      @media (max-width: 600px) {
        nav {
          flex-direction: column;
          align-items: flex-start;
        }

        .menu {
          flex-direction: column;
          width: 100%;
          margin-top: 10px;
          text-align: center;
        }

        .menu a {
          padding: 10px 0;
          width: 100%;
          border-bottom: 1px solid #faf8f8;
        }
      }

      .form-container {
        margin: auto;
          background: white;
          padding: 30px;
          border-radius: 10px;
          box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
          width: 300px;
          margin-top: 40px;
        }

        .form-container h2 {
          text-align: center;
          margin-bottom: 20px;
          color: #333;
        }

        label {
          display: block;
          margin-bottom: 5px;
          font-weight: bold;
          color: #555;
        }

        input {
          width: 100%;
          padding: 10px;
          margin-bottom: 15px;
          border: 1px solid #ccc;
          border-radius: 5px;
          transition: all 0.3s;
        }

        input:focus {
          border-color: rgb(205, 78, 56);
          box-shadow: 0 0 8px rgba(255, 99, 71, 0.6);
          outline: none;
        }

        button {
          width: 100%;
          padding: 10px;
          background: rgb(205, 78, 56);
          border: none;
          border-radius: 5px;
          color: white;
          font-size: 16px;
          cursor: pointer;
        
        }

        button:focus {
          border-color: rgb(205, 78, 56);
          box-shadow: 0 0 8px rgba(255, 99, 71, 0.6);
         
        }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">MyLogo</div>
      <div class="menu">
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Services</a>
        <a href="">Contact</a>
      </div>
    </nav>

    <div class="form-container">
      <h2>Login Form</h2>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
        />

        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
