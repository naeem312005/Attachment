<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <style>
      .card {
        width: 450px;
        background-color: burlywood;
        margin: auto;
        text-align: center;
        border-radius: 5px;
        box-shadow:  0px 4px 10px rgba(0, 0, 0, 0.2);
        margin-bottom: 20px;
        color: #fff;
        border: 1px solid #000;
      }
      .card img {
        margin: 10px 70px;
        width: 300px;
        height: 300px;
        border: 3px dotted #000;
        border-radius: 50%;
      }
      .card h2 {
        font-size: 30px;
        padding: 0px 20px;
      }
      .card p {
        font-size: 18px;
        padding: 0px 30px;
      }
      .card span{
        font-size: 24px;
        color: #4b4646;
      }
      .card button {
        width: 160px;

        font-size: 18px;
        background: rgb(210, 123, 10);
        padding: 10px;
        border-radius: 5px;
        border: none;
        outline: none;
        margin-bottom: 30px;
        cursor: pointer;
        transition: .5s;
      }
      button:hover {
    outline: 2px solid rgb(210, 123, 10); 
    color: rgb(210, 123, 10);
    background-color: #fff;
    font-size:20px;  
}

    </style>
  </head>
  <body>


    <!--Task 1 & 4-->
    <div class="card">
      <img src="watch.jpg" alt="Smart Watch" />
      <h2>Product Name: Smart Watch</h2>
      <p>
        <strong>Description:</strong> This watch helps you track time,
        heartbeat, and manage calls.
      </p>
      <span><strong>Price:</strong> $50</span>

      <br /><br />
      <button>Add to Cart</button>
    </div>
  </body>
</html>
