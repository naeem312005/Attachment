<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      h1{
        text-align: center;
        font-size: 40px;
        padding: 40px;
      }
      .flex-container{
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
       padding: 20px;
       width: 100%;
      }
      .flex-container .flex-item{
        padding: 20px;
      }
      .flex-container .flex-item img{
        width: 100%;
      }

      @media  (max-width: 800px) {
  .flex-container{
    flex-direction: column;
     align-items: center;
        justify-content: center;
       padding: 20px;
  }
}
    </style>
  </head>
  <body>
    <h1>Photo Gallery</h1>
    <div class="flex-container">
      <div class="flex-item">
        <img src="image-1.png" alt="" />
      </div>
      <div class="flex-item">
        <img src="image-2.png" alt="" />
      </div>
      <div class="flex-item">
        <img src="image-3.png" alt="" />
      </div>
    </div>
     <div class="flex-container">
      <div class="flex-item">
        <img src="image-1.png" alt="" />
      </div>
      <div class="flex-item">
        <img src="image-2.png" alt="" />
      </div>
      <div class="flex-item">
        <img src="image-3.png" alt="" />
      </div>
    </div>
  </body>
</html>
